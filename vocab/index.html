<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="學測單字">
<meta name="theme-color" content="#2b5cd6">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>學測單字</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, exam-paper sentence card in the middle, thumb-reach answer buttons below. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#18202b; --muted:#5b6676; --line:#d9dee6;
  --accent:#2b5cd6; --accent-soft:#e3eafb; --ok:#1f8a4c; --ok-soft:#dff3e7; --bad:#c8432f; --bad-soft:#fbe5e1;
  --hl:#fff1a8;
  --f-zh:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#1a2029; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2c3440;
  --accent:#7ea2ff; --accent-soft:#1f2b47; --ok:#5fcf8c; --ok-soft:#173326; --bad:#ff8a77; --bad-soft:#3a1f1b; --hl:#5a4d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#1a2029; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2c3440;
  --accent:#7ea2ff; --accent-soft:#1f2b47; --ok:#5fcf8c; --ok-soft:#173326; --bad:#ff8a77; --bad-soft:#3a1f1b; --hl:#5a4d12; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-zh);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:.02em}
.sync{font-size:.75rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mode{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode b{font-size:1.05rem}
.mode span{font-size:.8rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border-radius:14px;padding:12px 8px;border:1px solid var(--line)}
.stat{text-align:center;display:flex;flex-direction:column}
.stat .n{font-family:var(--f-num);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat .l{font-size:.72rem;color:var(--muted)}
.label{font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.go{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border-radius:12px;padding:13px 10px;font-weight:700;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1424}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1424}}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.weak{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.weak ol{margin:6px 0 0;padding-left:1.3em;font-size:.88rem}
.weak li{margin:2px 0}
.weak .en{font-family:var(--f-en)}
/* quiz */
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted)}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px;font-size:.75rem;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.prompt{font-size:.85rem;color:var(--muted)}
.sent{font-family:var(--f-en);font-size:1.15rem;line-height:1.55}
.sent + .sent{border-top:1px dashed var(--line);padding-top:8px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center;font-weight:600}
.blank.ok{color:var(--ok);border-color:var(--ok)}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:3px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start;min-height:48px}
.opt .k{font-family:var(--f-num);color:var(--muted);flex:none}
.opt .t{min-width:0}
.opt.en .t{font-family:var(--f-en);font-size:1.05rem}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb h3{margin:0;font-size:1rem}
.fb .ok-t{color:var(--ok)} .fb .bad-t{color:var(--bad)}
.fb ul{margin:0;padding-left:1.2em}
.done{text-align:center}
.done .big{font-family:var(--f-num);font-size:2.6rem}
.foot{font-size:.75rem;color:var(--muted);text-align:center}
.err{color:var(--bad)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>

<div class="wrap" id="app">
  <header><h1>學測單字</h1><span class="sync" id="sync">載入中…</span></header>
  <p id="loading">正在載入題庫…</p>
</div>

<script>
(() => {
const VERSION = '1109-1';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const KEY = 'xc-vocab-v1', EKEY = 'xc-vocab-errs-v1', LKEY = 'xc-vocab-len', FKEY = 'xc-vocab-filter', MKEY = 'xc-vocab-mode';
let SESSION = 20; try { const v = +localStorage.getItem(LKEY); if (v) SESSION = v; } catch(e){}
const MODES = {pick:{name:'例句選字',sub:'學測詞彙題'}, e2c:{name:'英翻中',sub:'看字選意思'}, c2e:{name:'中翻英',sub:'看意思選字'}};
const FILTERS = ['4–6級','全部','1級','2級','3級','4級','5級','6級'];
let mode = 'pick', filter = '4–6級';
try { mode = localStorage.getItem(MKEY) || mode; filter = localStorage.getItem(FKEY) || filter; } catch(e){}
if (!MODES[mode]) mode = 'pick'; if (!FILTERS.includes(filter)) filter = '4–6級';

let W = [], BY = {}, ITEMS = [];
let prog = load();
let errs = (() => { try { return JSON.parse(localStorage.getItem(EKEY) || '[]'); } catch(e){ return []; } })();
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(prog)); localStorage.setItem(EKEY, JSON.stringify(errs)); } catch(e){} }
function savePrefs(){ try { localStorage.setItem(MKEY, mode); localStorage.setItem(FKEY, filter); } catch(e){} }

function buildItems(){
  ITEMS = [];
  for (const w of W){
    BY[w.w.toLowerCase()] = w;
    if (w.ex && w.dx && w.dx.length === 3) ITEMS.push({key:`v:${w.w}:pick`, mode:'pick', w});
    ITEMS.push({key:`v:${w.w}:e2c`, mode:'e2c', w});
    ITEMS.push({key:`v:${w.w}:c2e`, mode:'c2e', w});
  }
}
const inFilter = w => filter==='全部' || (filter==='4–6級' ? w.lv >= 4 : w.lv === +filter[0]);
const pool = () => ITEMS.filter(it => it.mode===mode && inFilter(it.w));
const st = k => prog[k] || {c:0,w:0,s:0,t:0};
const mastered = k => st(k).s >= 2;
const isWeak = k => { const x = st(k); return x.w > 0 && x.s < 2; };
const disp = w => w.w.replace(/\s*\(.*\)$/,'');

function blankify(sent){ return esc(sent).replace(/\{[^}]+\}/g, '<span class="blank">&nbsp;</span>'); }
function highlight(sent){ return esc(sent).replace(/\{([^}]+)\}/g, '<mark>$1</mark>'); }
function others(w, n){
  // 同詞性、同級或相鄰級的其他字
  let c = W.filter(x => x !== w && x.pos === w.pos && Math.abs(x.lv - w.lv) <= 1 && x.zh !== w.zh);
  if (c.length < n) c = W.filter(x => x !== w && x.pos === w.pos);
  return pick(c, n);
}
function wordCard(w){ return `<div><b class="en" style="font-family:var(--f-en);font-size:1.1rem">${esc(disp(w))}</b>　${esc(w.pos)} ${esc(w.zh)}　<span class="tag">第${w.lv}級</span></div>`
  + (w.ex ? `<div class="sent" style="font-size:1rem">${highlight(w.ex)}</div><div>${esc(w.exz||'')}</div>` : ''); }

function makeQ(it){
  const w = it.w;
  if (it.mode === 'pick'){
    const m = w.ex.match(/\{([^}]+)\}/), ans = m[1];
    const cap = /^[A-Z]/.test(ans), fixc = x => cap ? x.charAt(0).toUpperCase() + x.slice(1) : x;
    const opts = shuffle([ans].concat(w.dx.map(fixc)));
    return { tag:`例句選字・第${w.lv}級`, prompt:'選出最適合填入空格的字', body:`<div class="sent">${blankify(w.ex)}</div>`, en:true,
      opts, answer: opts.indexOf(ans), ty:'例句選字',
      feedback: ok => `<h3 class="${ok?'ok-t':'bad-t'}">${ok?'答對了':'正解：'+esc(ans)}</h3>${wordCard(w)}<ul>${w.dx.map(d => { const x = BY[d.toLowerCase()]; return `<li><span style="font-family:var(--f-en)">${esc(d)}</span>${x ? '：'+esc(x.zh) : ''}</li>`; }).join('')}</ul>`,
      filled: () => `<div class="sent">${highlight(w.ex)}</div>` };
  }
  if (it.mode === 'e2c'){
    const o = others(w, 3), opts = shuffle([w.zh].concat(o.map(x => x.zh)));
    return { tag:`英翻中・第${w.lv}級`, prompt:'這個字的意思是？', body:`<div class="sent" style="font-size:1.5rem;text-align:center">${esc(disp(w))} <span style="font-size:.9rem;color:var(--muted)">${esc(w.pos)}</span></div>`,
      opts, answer: opts.indexOf(w.zh), ty:'英翻中',
      feedback: ok => `<h3 class="${ok?'ok-t':'bad-t'}">${ok?'答對了':'正解：'+esc(w.zh)}</h3>${wordCard(w)}<ul>${o.map(x=>`<li><span style="font-family:var(--f-en)">${esc(disp(x))}</span>：${esc(x.zh)}</li>`).join('')}</ul>` };
  }
  const o = others(w, 3), opts = shuffle([disp(w)].concat(o.map(disp)));
  return { tag:`中翻英・第${w.lv}級`, prompt:'哪一個字是這個意思？', body:`<div class="sent" style="font-size:1.3rem;text-align:center;font-family:var(--f-zh)">${esc(w.zh)} <span style="font-size:.9rem;color:var(--muted)">${esc(w.pos)}</span></div>`, en:true,
    opts, answer: opts.indexOf(disp(w)), ty:'中翻英',
    feedback: ok => `<h3 class="${ok?'ok-t':'bad-t'}">${ok?'答對了':'正解：'+esc(disp(w))}</h3>${wordCard(w)}<ul>${o.map(x=>`<li><span style="font-family:var(--f-en)">${esc(disp(x))}</span>：${esc(x.zh)}</li>`).join('')}</ul>` };
}

/* ---------- session ---------- */
let queue = [], qi = 0, score = 0, total = 0, cur = null;
function nextBatch(onlyWeak){
  const P = pool(), used = new Set(queue.slice(Math.max(0,qi-30)).map(z=>z.key));
  const n = SESSION === 999 ? 20 : SESSION;
  if (onlyWeak) return shuffle(P.filter(it => isWeak(it.key) && !used.has(it.key))).slice(0,n);
  const weak = shuffle(P.filter(it => isWeak(it.key) && !used.has(it.key)));
  const fresh = shuffle(P.filter(it => !prog[it.key]));
  const rest = shuffle(P.filter(it => prog[it.key] && !isWeak(it.key) && !mastered(it.key) && !used.has(it.key)));
  const done = shuffle(P.filter(it => mastered(it.key) && !used.has(it.key)));
  return weak.slice(0, Math.ceil(n*0.3)).concat(fresh, rest, done).slice(0,n);
}
function startSession(onlyWeak){ queue = []; qi = 0; const list = nextBatch(onlyWeak); if (!list.length) return; queue = list; score = 0; total = list.length; renderQ(); }
function renderQ(){
  if (qi >= queue.length && SESSION === 999){ const more = nextBatch(false); if (more.length) queue = queue.concat(more); }
  if (qi >= queue.length) return renderDone();
  cur = { it: queue[qi], q: makeQ(queue[qi]), answered:false };
  const q = cur.q, letters = 'ABCD';
  $('#app').innerHTML = `
    <div class="qtop"><span><span class="tag">${esc(q.tag)}</span></span><span style="font-family:var(--f-num)">${SESSION===999 ? `第 ${qi+1} 題・答對 ${score}` : `${qi+1} / ${queue.length}`}</span></div>
    <div class="bar"><i style="width:${SESSION===999 ? (qi%20)/20*100 : qi/queue.length*100}%"></i></div>
    <div class="card"><div class="prompt">${q.prompt}</div><div id="body">${q.body}</div></div>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${q.en?'en':''}" data-i="${i}"><span class="k">${letters[i]}</span><span class="t">${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div>
    <div class="go"><button class="btn ghost" id="quit">結束</button><button class="btn primary" id="next" hidden>下一題</button></div>`;
  document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(+b.dataset.i)));
  $('#quit').addEventListener('click', () => qi > 0 ? renderDone() : renderHome());
  $('#next').addEventListener('click', () => { qi++; renderQ(); });
  window.scrollTo(0,0);
}
function answer(i){
  if (cur.answered) return; cur.answered = true;
  const q = cur.q, ok = i === q.answer, k = cur.it.key, x = st(k);
  document.querySelectorAll('.opt').forEach((b,j) => { b.disabled = true; if (j===q.answer) b.classList.add('ok'); else if (j===i) b.classList.add('bad'); });
  if (ok){ score++; x.c++; x.s++; } else { x.w++; x.s = 0;
    errs.push({k, m: cur.it.mode, ty: q.ty, lv: cur.it.w.lv, a: (cur.it.mode==='e2c' ? disp(cur.it.w)+' '+q.opts[q.answer] : q.opts[q.answer]), p: q.opts[i], t: Date.now()});
    if (errs.length > 1500) errs = errs.slice(-1500);
    const pos = Math.min(queue.length, qi + 3 + Math.floor(Math.random()*3));
    if (queue.filter(z=>z.key===k).length < 2) queue.splice(pos, 0, cur.it);
  }
  x.t = Date.now(); prog[k] = x; saveLocal();
  if (q.filled) $('#body').innerHTML = q.filled();
  $('#fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}">${q.feedback(ok)}</div>`;
  $('#next').hidden = false; $('#next').textContent = (qi+1 >= queue.length && SESSION !== 999) ? '看結果' : '下一題';
  $('#next').scrollIntoView({block:'nearest', behavior:'smooth'});
}
function renderDone(){
  $('#app').innerHTML = `<header><h1>學測單字</h1><span class="sync" id="sync"></span></header>
    <div class="card done"><div class="label">本輪答對</div><div class="big">${score} / ${Math.max(1, Math.min(queue.length, qi + (cur && cur.answered ? 1 : 0)))}</div>
    <div>${queue.length>total?`其中 ${queue.length-total} 題是答錯後的重練`:''}</div></div>
    <div class="go"><button class="btn ghost" id="home">回首頁</button><button class="btn primary" id="again">再一輪</button></div>`;
  $('#home').addEventListener('click', renderHome); $('#again').addEventListener('click', () => startSession(false));
  showSync();
}

/* ---------- error patterns ---------- */
function renderPattern(){
  const E = errs.filter(e => e.m === mode);
  const byLv = {}; E.forEach(e => byLv[e.lv] = (byLv[e.lv]||0)+1);
  const lvs = Object.entries(byLv).sort((a,b)=>a[0]-b[0]); const maxL = Math.max(1, ...lvs.map(x=>x[1]));
  const pairs = {}; E.forEach(e => { const key = e.a + '｜' + e.p; pairs[key] = (pairs[key]||0)+1; });
  const topPairs = Object.entries(pairs).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const recent = E.filter(e => Date.now()-e.t < 7*864e5).length;
  $('#app').innerHTML = `
    <header><h1>錯題態樣</h1><span class="sync" id="sync"></span></header>
    <div class="modes">${Object.entries(MODES).map(([m,v])=>`<button class="mode" data-m="${m}" aria-pressed="${mode===m}"><b>${v.name}</b><span>${errs.filter(e=>e.m===m).length} 筆錯題</span></button>`).join('')}</div>
    ${E.length ? `
    <div class="weak"><div class="label">各級錯題數</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${lvs.map(([l,n])=>`
        <div><div style="display:flex;justify-content:space-between;font-size:.9rem"><span>第 ${l} 級</span><span style="font-family:var(--f-num)">${n}</span></div>
        <div class="bar" style="height:8px"><i style="width:${n/maxL*100}%;background:var(--bad)"></i></div></div>`).join('')}</div></div>
    <div class="weak"><div class="label">最常混淆（正解 ← 你選的）</div><ol>${topPairs.map(([k,n])=>{const [a,p]=k.split('｜');return `<li><span class="en">${esc(a)}</span> ← <span class="en" style="color:var(--bad)">${esc(p)}</span>　${n} 次</li>`;}).join('')}</ol></div>
    <p class="foot">共 ${E.length} 筆錯題，最近 7 天 ${recent} 筆。</p>` :
    `<div class="card"><div>還沒有錯題紀錄。開始練習後，這裡會統計各級的錯題數，以及最常把哪兩個選項搞混。</div></div>`}
    ${errs.length ? `<button class="btn primary" id="export">複製錯題報告（傳給老師）</button><textarea id="exp" readonly hidden style="width:100%;min-height:180px;font:inherit;font-size:.8rem;border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line)"></textarea><div id="expmsg" class="foot" hidden></div>` : ''}
    <div class="go"><button class="btn ghost" id="home">回首頁</button><button class="btn primary" id="weakgo" ${pool().some(it=>isWeak(it.key))?'':'disabled'}>練這些錯題</button></div>`;
  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; savePrefs(); renderPattern(); }));
  $('#home').addEventListener('click', renderHome);
  $('#weakgo').addEventListener('click', () => startSession(true));
  const ex = $('#export');
  if (ex) ex.addEventListener('click', () => {
    const t = buildReport(), ta = $('#exp'), msg = $('#expmsg');
    ta.value = t; ta.hidden = false; msg.hidden = false;
    const done = () => { msg.textContent = '已複製。打開 LINE 或訊息，長按貼上傳給老師。'; };
    const fail = () => { ta.focus(); ta.select(); msg.textContent = '這裡無法自動複製：請長按上方文字，選「全選」再「拷貝」。'; };
    try { navigator.clipboard.writeText(t).then(done, fail); } catch(e){ fail(); }
  });
  showSync();
}
function buildReport(){
  const d = new Date(), lines = [`【學測單字】錯題報告 ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`];
  for (const m of Object.keys(MODES)){
    const E = errs.filter(e => e.m === m); if (!E.length) continue;
    const all = ITEMS.filter(it => it.mode === m), seen = all.filter(it => prog[it.key]);
    const c = seen.reduce((a,it)=>a+st(it.key).c,0), w = seen.reduce((a,it)=>a+st(it.key).w,0);
    lines.push('', '■ ' + MODES[m].name);
    lines.push(`練過 ${seen.length}／${all.length} 題，作答 ${c+w} 次，答對率 ${c+w ? Math.round(c/(c+w)*100) : 0}%，熟練 ${all.filter(it=>mastered(it.key)).length} 題`);
    const byLv = {}; E.forEach(e => byLv[e.lv] = (byLv[e.lv]||0)+1);
    lines.push('各級錯題：' + Object.entries(byLv).sort((a,b)=>a[0]-b[0]).map(([l,n])=>`第${l}級 ${n}`).join('、'));
    const pairs = {}; E.forEach(e => { const k = e.a+' ← '+e.p; pairs[k] = (pairs[k]||0)+1; });
    lines.push('錯誤組合（正解 ← 誤選）：');
    Object.entries(pairs).sort((a,b)=>b[1]-a[1]).slice(0,40).forEach(([k,n]) => lines.push(`- ${k}（${n}）`));
    const weak = all.filter(it => isWeak(it.key)).sort((a,b)=>st(b.key).w-st(a.key).w).slice(0,40);
    if (weak.length){ lines.push('尚未熟練：'); weak.forEach(it => lines.push(`- ${disp(it.w)}｜第${it.w.lv}級（錯 ${st(it.key).w}）`)); }
  }
  return lines.join('\n');
}

/* ---------- move progress ---------- */
const b64 = u8 => { let s=''; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
function packProgress(){ return 'XCV:' + b64(new TextEncoder().encode(JSON.stringify({p:prog, e:errs}))); }
function unpackProgress(code){
  code = String(code||'').replace(/[^A-Za-z0-9+/=:]/g,'');
  const m = code.match(/xcv:/i); if (m) code = code.slice(m.index + 4);
  code = code.replace(/:/g,'');
  const d = JSON.parse(new TextDecoder().decode(unb64(code)));
  if (!d || typeof d !== 'object' || !d.p) throw new Error('content');
  return d;
}
function mergeProgress(d){
  let n = 0;
  for (const [k,v] of Object.entries(d.p || {})){ const c = prog[k]; if (!c || (v.t||0) > (c.t||0)){ prog[k] = v; n++; } }
  const seen = new Set(errs.map(e => e.k + '@' + e.t));
  for (const e of (d.e || [])) if (!seen.has(e.k + '@' + e.t)) errs.push(e);
  errs.sort((a,b) => a.t - b.t); if (errs.length > 1500) errs = errs.slice(-1500);
  saveLocal(); return n;
}
function renderMove(){
  $('#app').innerHTML = `
    <header><h1>搬移進度</h1><span class="sync" id="sync"></span></header>
    <div class="card"><div class="label">步驟 1：在原本的裝置</div>
      <div>這台目前有 ${Object.keys(prog).length} 題的作答紀錄、${errs.length} 筆錯題。按下面的按鈕複製進度碼，用 LINE 或 AirDrop 傳到另一台裝置。</div>
      <button class="btn primary" id="copy">複製進度碼</button>
      <textarea id="out" readonly autocapitalize="off" autocorrect="off" spellcheck="false" hidden style="width:100%;min-height:90px;font-family:var(--f-num);font-size:.7rem;border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);word-break:break-all"></textarea>
      <div id="outmsg" class="foot" hidden></div></div>
    <div class="card"><div class="label">步驟 2：在另一台裝置</div>
      <div>打開這個網頁，進到這一頁，把收到的進度碼長按貼在下面，再按「匯入」。兩台的紀錄會合併，同一題以較新的一次為準。</div>
      <textarea id="in" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="在這裡貼上進度碼" style="width:100%;min-height:90px;font-family:var(--f-num);font-size:.75rem;border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line)"></textarea>
      <button class="btn primary" id="imp">匯入</button><div id="inmsg" class="foot" hidden></div></div>
    <div class="go"><button class="btn ghost" id="home">回首頁</button></div>
    <p class="foot">程式版本 ${VERSION}（單字進度與片語 App 分開）</p>`;
  $('#home').addEventListener('click', renderHome);
  $('#copy').addEventListener('click', () => {
    const code = packProgress(), ta = $('#out'), msg = $('#outmsg'); ta.value = code; ta.hidden = false; msg.hidden = false;
    const ok = () => { msg.textContent = '已複製進度碼。到另一台裝置貼上即可。'; };
    const fail = () => { ta.focus(); ta.select(); msg.textContent = '無法自動複製：請長按上方的進度碼，選「全選」再「拷貝」。'; };
    try { navigator.clipboard.writeText(code).then(ok, fail); } catch(e){ fail(); }
  });
  $('#imp').addEventListener('click', () => {
    const msg = $('#inmsg'); msg.hidden = false;
    try { const n = mergeProgress(unpackProgress($('#in').value)); msg.textContent = `匯入完成：更新了 ${n} 題的紀錄。`; }
    catch(e){ msg.textContent = '進度碼無法讀取，請確認整段都有貼上（單字 App 的進度碼以 XCV: 開頭）。'; }
  });
  showSync();
}

/* ---------- home ---------- */
function renderHome(){
  const P = pool(), seen = P.filter(it => prog[it.key]).length, mast = P.filter(it => mastered(it.key)).length, weak = P.filter(it => isWeak(it.key));
  const weakList = weak.sort((a,b)=>st(b.key).w - st(a.key).w).slice(0,5).map(it => `<li><span class="en">${esc(disp(it.w))}</span>　${esc(it.w.zh)}　錯 ${st(it.key).w} 次</li>`).join('');
  $('#app').innerHTML = `
    <header><h1>學測單字</h1><span class="sync" id="sync"></span></header>
    <div class="modes">${Object.entries(MODES).map(([m,v])=>`<button class="mode" data-m="${m}" aria-pressed="${mode===m}"><b>${v.name}</b><span>${v.sub}</span></button>`).join('')}</div>
    <div class="stats">
      <div class="stat"><span class="n">${P.length}</span><span class="l">題目</span></div>
      <div class="stat"><span class="n">${seen}</span><span class="l">練過</span></div>
      <div class="stat"><span class="n">${mast}</span><span class="l">熟練</span></div>
      <div class="stat"><span class="n">${weak.length}</span><span class="l">待重練</span></div>
    </div>
    <div class="label">範圍（大考中心詞彙表）</div>
    <div class="chips">${FILTERS.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${filter===c}">${esc(c)}</button>`).join('')}</div>
    <div class="label">每輪題數</div>
    <div class="chips">${[10,20,50,999].map(n=>`<button class="chip len" data-n="${n}" aria-pressed="${SESSION===n}">${n===999?'不限':n+' 題'}</button>`).join('')}</div>
    <div class="go"><button class="btn primary" id="start" ${P.length?'':'disabled'}>${SESSION===999?'開始連續練習':'開始 '+Math.min(SESSION,P.length)+' 題'}</button>
      <button class="btn ghost" id="weakbtn" ${weak.length?'':'disabled'}>只練錯題</button></div>
    <button class="btn ghost" id="pat">錯題態樣${errs.length?`（${errs.length} 筆）`:''}</button>
    ${weak.length?`<div class="weak"><div class="label">最常錯</div><ol>${weakList}</ol></div>`:''}
    <p class="foot">共 ${W.length} 字。連續答對 2 次算熟練；答錯的題目會在幾題後再出現。</p>
    <button class="btn ghost" id="move">搬移進度到另一台裝置</button>
    <p class="foot"><a href="../" style="color:var(--accent)">← 片語・一字多義練習</a></p>`;
  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; savePrefs(); renderHome(); }));
  document.querySelectorAll('.chip[data-c]').forEach(b => b.addEventListener('click', () => { filter = b.dataset.c; savePrefs(); renderHome(); }));
  document.querySelectorAll('.chip.len').forEach(b => b.addEventListener('click', () => { SESSION = +b.dataset.n; try { localStorage.setItem(LKEY, SESSION); } catch(e){} renderHome(); }));
  $('#pat').addEventListener('click', renderPattern);
  $('#move').addEventListener('click', renderMove);
  $('#start').addEventListener('click', () => startSession(false));
  $('#weakbtn').addEventListener('click', () => startSession(true));
  showSync();
}
const syncText = '進度存在這台裝置';
function showSync(){ const el = $('#sync'); if (el) el.textContent = syncText; }

fetch('vocab.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  W = d; buildItems(); renderHome();
}).catch(() => { $('#loading').innerHTML = '<span class="err">題庫載入失敗，請重新整理頁面。</span>'; });
})();
</script>
